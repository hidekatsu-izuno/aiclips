    </clipPath>
    <linearGradient id="cloud-data-store-gold" x1="0" y1="0" x2=".4" y2="1">
      <stop offset="0" stop-color="#ffe950" />
      <stop offset=".5" stop-color="#ffd126" />
      <stop offset="1" stop-color="#eda70a" />
    </linearGradient>
    <linearGradient id="cloud-data-store-gold-edge" x1="0" y1="0" x2=".4" y2="1">
      <stop offset="0" stop-color="#fff6ad" />
      <stop offset=".5" stop-color="#ffdf43" />
      <stop offset="1" stop-color="#cb8807" />
    </linearGradient>
    <path id="cloud-data-store-folder" d="M111 132 H137 Q140 132 142 135 L149 143 H195 Q201 143 201 149 V188 Q201 195 194 195 H112 Q105 195 105 188 V139 Q105 132 111 132 Z" />
    <clipPath id="cloud-data-store-folder-clip"><use href="#cloud-data-store-folder" /></clipPath>
  </defs>
  <g stroke-linecap="round" stroke-linejoin="round">
    <use href="#cloud-data-store-body" fill="url(#cloud-data-store-face-paint)" />
    <use href="#cloud-data-store-body" fill="none" stroke="url(#cloud-data-store-edge-paint)" stroke-width="19" clip-path="url(#cloud-data-store-body-clip)" />
    <path d="M208 107 C229 108 243 124 243 146 C243 169 229 188 206 188 H100 C90 188 80 181 73 173 C109 177 151 172 178 153 C193 141 205 123 208 107 Z" fill="url(#cloud-data-store-shadow-paint)" clip-path="url(#cloud-data-store-body-clip)" />
    <use href="#cloud-data-store-body" fill="none" stroke="#050b1d" stroke-width="7" />
  </g>
  <g id="cloud-data-store-closed-folder" stroke-linecap="round" stroke-linejoin="round">
    <use href="#cloud-data-store-folder" fill="none" stroke="#050b1d" stroke-width="11" />
    <use href="#cloud-data-store-folder" fill="url(#cloud-data-store-gold)" />
    <use href="#cloud-data-store-folder" fill="none" stroke="url(#cloud-data-store-gold-edge)" stroke-width="7" clip-path="url(#cloud-data-store-folder-clip)" />
    <use href="#cloud-data-store-folder" fill="none" stroke="#050b1d" stroke-width="3" />
    <path d="M112 147 H141" fill="none" stroke="#ce940c" stroke-width="1.5" />
  </g>
</svg>
