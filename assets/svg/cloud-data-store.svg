<svg xmlns="http://www.w3.org/2000/svg" width="288" height="288" viewBox="0 0 288 288" role="img" aria-labelledby="cloud-data-store-title">
  <title id="cloud-data-store-title">クラウドデータストア</title>
  <desc>Editable geometry, exact symmetry where applicable, shared component boundaries and gradient-only inset bevels. No raster images, text rendering or blur filters.</desc>
  <defs>
    <linearGradient id="cloud-data-store-face-paint" gradientUnits="userSpaceOnUse" x1="100" y1="77" x2="227" y2="176">
      <stop offset="0" stop-color="#0cc2f2" />
      <stop offset="0.5" stop-color="#00b5ef" />
      <stop offset="1" stop-color="#009cff" />
    </linearGradient>
    <linearGradient id="cloud-data-store-edge-paint" gradientUnits="userSpaceOnUse" x1="102" y1="67" x2="189" y2="171">
      <stop offset="0" stop-color="#67e6ff" stop-opacity="0.95" />
      <stop offset="0.6" stop-color="#35d3ff" stop-opacity="0.55" />
      <stop offset="1" stop-color="#0bb7f2" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="cloud-data-store-shadow-paint" gradientUnits="userSpaceOnUse" x1="180" y1="113" x2="211" y2="182">
      <stop offset="0" stop-color="#008df9" stop-opacity="0" />
      <stop offset="1" stop-color="#008cf6" stop-opacity="0.75" />
    </linearGradient>
    <path id="cloud-data-store-body" d="M156.5 57 C128 57 105 79 105 107 C81 108 63 124 63 146 C63 169 78 188 100 188 H206 C229 188 243 169 243 146 C243 124 229 108 208 107 C208 79 185 57 156.5 57 Z" />
    <clipPath id="cloud-data-store-body-clip">
