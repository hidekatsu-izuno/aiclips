<svg xmlns="http://www.w3.org/2000/svg" width="288" height="288" viewBox="0 0 288 288" role="img" aria-labelledby="browser-frame-title">
  <title id="browser-frame-title">ブラウザー</title>
  <desc>Editable paths with shared boundaries, symmetric structural geometry, clipped bevels and crisp gradient shadows. No blur or raster images.</desc>
  <defs>
    <linearGradient id="browser-frame-white" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="1" stop-color="#edf2f7" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="browser-frame-white-edge" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="0.45" stop-color="#f7fbff" stop-opacity="1" />
      <stop offset="1" stop-color="#bfd0de" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="browser-frame-blue" gradientUnits="userSpaceOnUse" x1="96" y1="93" x2="192" y2="205">
      <stop offset="0" stop-color="#10c4fb" stop-opacity="1" />
      <stop offset="0.45" stop-color="#009cff" stop-opacity="1" />
      <stop offset="1" stop-color="#0085f4" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="browser-frame-blue-edge" gradientUnits="userSpaceOnUse" x1="91" y1="92" x2="191" y2="203">
      <stop offset="0" stop-color="#83e7ff" stop-opacity="1" />
      <stop offset="0.5" stop-color="#16b9ff" stop-opacity="0.6" />
      <stop offset="1" stop-color="#006bdd" stop-opacity="0.7" />
    </linearGradient>
    <rect id="browser-frame-body" x="58" y="66" width="172" height="155" rx="19" />
    <clipPath id="browser-frame-body-clip">
      <use href="#browser-frame-body" />
    </clipPath>
    <path id="browser-frame-header" d="M77 66 H211 A19 19 0 0 1 230 85 V106 H58 V85 A19 19 0 0 1 77 66 Z" />
    <clipPath id="browser-frame-header-clip">
      <use href="#browser-frame-header" />
    </clipPath>
    <linearGradient id="browser-frame-dot-0-paint" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffb8bb" stop-opacity="1" />
      <stop offset="0.45" stop-color="#ff5359" stop-opacity="1" />
      <stop offset="1" stop-color="#ff5359" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="browser-frame-dot-1-paint" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#9cf7bd" stop-opacity="1" />
      <stop offset="0.45" stop-color="#35d875" stop-opacity="1" />
      <stop offset="1" stop-color="#35d875" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="browser-frame-dot-2-paint" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#a9ffd0" stop-opacity="1" />
      <stop offset="0.45" stop-color="#29d96d" stop-opacity="1" />
      <stop offset="1" stop-color="#29d96d" stop-opacity="1" />
    </linearGradient>
  </defs>
  <g stroke-linecap="round" stroke-linejoin="round">
    <use href="#browser-frame-body" fill="url(#browser-frame-white)" />
    <use href="#browser-frame-body" fill="none" stroke="url(#browser-frame-white-edge)" stroke-width="14" clip-path="url(#browser-frame-body-clip)" />
    <use href="#browser-frame-header" fill="url(#browser-frame-blue)" />
    <path d="M58 106 V85 A19 19 0 0 1 77 66 H211 A19 19 0 0 1 230 85 V106" fill="none" stroke="url(#browser-frame-blue-edge)" stroke-width="15" clip-path="url(#browser-frame-header-clip)" />
    <path d="M58 106 H230" fill="none" stroke="#27475f" stroke-width="1.5" />
    <circle cx="82" cy="91" r="7.5" fill="url(#browser-frame-dot-0-paint)" stroke="#050b1d" stroke-width="1.8" />
    <path d="M78.5 91.5 A4.5 4.5 0 0 1 83 87" fill="none" stroke="#ffb8bb" stroke-width="2.2" />
    <circle cx="104" cy="91" r="7.5" fill="url(#browser-frame-dot-1-paint)" stroke="#050b1d" stroke-width="1.8" />
    <path d="M100.5 91.5 A4.5 4.5 0 0 1 105 87" fill="none" stroke="#9cf7bd" stroke-width="2.2" />
    <circle cx="126" cy="91" r="7.5" fill="url(#browser-frame-dot-2-paint)" stroke="#050b1d" stroke-width="1.8" />
    <path d="M122.5 91.5 A4.5 4.5 0 0 1 127 87" fill="none" stroke="#a9ffd0" stroke-width="2.2" />
    <rect x="77" y="117" width="135.5" height="21" rx="10.5" fill="#ffffff" stroke="#a3b5c5" stroke-width="3" />
    <circle cx="202" cy="127.5" r="12" fill="#009dff" />
    <circle cx="200.5" cy="126" r="4.5" fill="none" stroke="white" stroke-width="1.3" />
    <path d="M204 129.5 L208 133.5" fill="none" stroke="white" stroke-width="1.3" />
    <rect x="75.5" y="149" width="55.5" height="49" rx="6" fill="#0ac4ed" />
    <path d="M147 155 H208.5" fill="none" stroke="#a9b8c7" stroke-width="11" />
    <path d="M147 174 H208.5" fill="none" stroke="#a9b8c7" stroke-width="11" />
    <path d="M147 193 H208.5" fill="none" stroke="#a9b8c7" stroke-width="11" />
    <use href="#browser-frame-body" fill="none" stroke="#050b1d" stroke-width="7" />
