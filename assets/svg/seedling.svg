    <g clip-path="url(#seedling-left-clip)">
      <path d="M74 109 Q70 97 74 89 C103 83 122 96 128 107" fill="none" stroke="#b0f67a" stroke-width="6" />
      <path d="M74 120 C91 144 117 143 137 135 L143 142 V153 H75Z" fill="#079e58" opacity=".42" />
