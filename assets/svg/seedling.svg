<svg xmlns="http://www.w3.org/2000/svg" width="288" height="288" viewBox="0 0 288 288" role="img" aria-labelledby="seedling-title">
  <title id="seedling-title">苗</title>
  <desc>Two rounded green leaves, a slender stem and a small mound of soil, with directional highlights and shadows.</desc>
  <defs>
    <linearGradient id="seedling-leaf" x1="0" y1="0" x2=".7" y2="1">
      <stop stop-color="#9aef63" />
      <stop offset=".5" stop-color="#54d94e" />
      <stop offset="1" stop-color="#00b36b" />
    </linearGradient>
    <linearGradient id="seedling-soil" x1="0" y1="0" x2=".8" y2="1">
      <stop stop-color="#c8823b" />
      <stop offset=".5" stop-color="#a65f2b" />
      <stop offset="1" stop-color="#79401f" />
    </linearGradient>
    <path id="seedling-left" d="M139 143 C98 154 65 128 67 87 Q67 82 74 82 C111 75 142 94 141 130Z" />
    <path id="seedling-right" d="M144 141 C140 96 169 70 215 77 Q220 77 219 83 C219 125 194 149 144 145Z" />
    <path id="seedling-mound" d="M93 204 C101 183 118 175 140 175 C162 175 179 184 188 204 Q192 213 183 213 H98 Q89 213 93 204Z" />
