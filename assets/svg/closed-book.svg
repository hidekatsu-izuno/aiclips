<svg xmlns="http://www.w3.org/2000/svg" width="288" height="288" viewBox="0 0 288 288" role="img" aria-labelledby="closed-book-title">
  <title id="closed-book-title">閉じた本</title>
  <desc>Editable paths with shared boundaries, symmetric structural geometry, clipped bevels and crisp gradient shadows. No blur or raster images.</desc>
  <defs>
    <linearGradient id="closed-book-white" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="1" stop-color="#edf2f7" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="closed-book-white-edge" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="0.45" stop-color="#f7fbff" stop-opacity="1" />
      <stop offset="1" stop-color="#bfd0de" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="closed-book-cover" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#1779f3" stop-opacity="1" />
      <stop offset="0.5" stop-color="#0863e5" stop-opacity="1" />
      <stop offset="1" stop-color="#0053cf" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="closed-book-cover-edge" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#6fc0ff" stop-opacity="1" />
      <stop offset="0.35" stop-color="#278cf6" stop-opacity="1" />
      <stop offset="1" stop-color="#003fa8" stop-opacity="1" />
    </linearGradient>
    <path id="closed-book-body" d="M97 64 H190 Q207 64 207 81 V211 Q207 219 195 219 H97 Q76 219 76 202 V85 Q76 64 97 64 Z" />
    <clipPath id="closed-book-body-clip">
      <use href="#closed-book-body" />
    </clipPath>
    <path id="closed-book-front" d="M94 64 H190 Q207 64 207 81 V173 Q207 185 195 185 H94 Z" />
    <clipPath id="closed-book-front-clip">
      <use href="#closed-book-front" />
    </clipPath>
    <path id="closed-book-pages" d="M94 185 H207 Q196 185 196 198 Q196 211 207 211 H94 Q83 211 83 198 Q83 185 94 185 Z" />
    <clipPath id="closed-book-pages-clip">
      <use href="#closed-book-pages" />
    </clipPath>
    <clipPath id="closed-book-spine-bevel-clip">
      <rect x="0" y="0" width="288" height="211" />
    </clipPath>
    <linearGradient id="closed-book-front-edge" gradientUnits="userSpaceOnUse" x1="94" y1="64" x2="127.9" y2="185">
      <stop offset="0" stop-color="#6fc0ff" stop-opacity="1" />
      <stop offset="0.35" stop-color="#278cf6" stop-opacity="1" />
      <stop offset="1" stop-color="#003fa8" stop-opacity="1" />
    </linearGradient>
  </defs>
  <g stroke-linecap="round" stroke-linejoin="round">
    <use href="#closed-book-body" fill="url(#closed-book-cover)" />
    <g clip-path="url(#closed-book-spine-bevel-clip)">
      <use href="#closed-book-body" fill="none" stroke="url(#closed-book-cover-edge)" stroke-width="14" clip-path="url(#closed-book-body-clip)" />
    </g>
    <path id="closed-book-bottom-bevel" d="M76 202 Q76 219 97 219 H195 Q207 219 207 211" fill="none" stroke="url(#closed-book-cover-edge)" stroke-width="10" clip-path="url(#closed-book-body-clip)" />
    <use href="#closed-book-front" fill="url(#closed-book-cover)" />
    <path id="closed-book-front-upper-bevel" d="M94 185 V64 H190 Q207 64 207 81 V173" fill="none" stroke="url(#closed-book-front-edge)" stroke-width="13" stroke-linecap="butt" clip-path="url(#closed-book-front-clip)" />
    <path id="closed-book-front-lower-bevel" d="M207 173 Q207 185 195 185 H94" fill="none" stroke="url(#closed-book-front-edge)" stroke-width="7" stroke-linecap="butt" clip-path="url(#closed-book-front-clip)" />
    <path d="M94 64 V185" fill="none" stroke="#050b1d" stroke-width="5" />
    <g id="closed-book-back-cover-inside">
      <path d="M194 185 H207 V211 H194 Z" fill="#2466cf" />
      <path d="M203 188 V208" fill="none" stroke="#68aaff" stroke-width="2" />
    </g>
    <use href="#closed-book-pages" fill="url(#closed-book-white)" />
    <use href="#closed-book-pages" fill="none" stroke="url(#closed-book-white-edge)" stroke-width="7" clip-path="url(#closed-book-pages-clip)" />
    <path id="closed-book-page-boundary" d="M207 185 H94 Q83 185 83 198 Q83 211 94 211 H207" fill="none" stroke="#050b1d" stroke-width="6" />
    <path id="closed-book-page-recess-boundary" d="M207 185 Q196 185 196 198 Q196 211 207 211" fill="none" stroke="#050b1d" stroke-width="3" />
    <path id="closed-book-outer-outline" d="M97 64 H190 Q207 64 207 81 V211 Q207 219 195 219 H97 Q76 219 76 202 V85 Q76 64 97 64" fill="none" stroke="#050b1d" stroke-width="7" />
  </g>
</svg>
