        <path d="M93 201 V229 M187 201 V229" fill="none" stroke="#4a7f8d" stroke-width="2" />
        <rect x="104" y="194" width="22" height="14" rx="2" fill="#96c7cd" stroke="#457987" stroke-width="3" />
        <rect x="154" y="194" width="22" height="14" rx="2" fill="#96c7cd" stroke="#457987" stroke-width="3" />
