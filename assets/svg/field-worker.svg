      <path d="M128 102 V65 Q129 54 140 55 Q152 55 152 65 V102" fill="url(#field-worker-helmet-yellow)" stroke="#d49b00" stroke-width="2.5" />
      <path d="M129 96 V67 Q129 60 135 58" fill="none" stroke="#fff284" stroke-width="3" />
