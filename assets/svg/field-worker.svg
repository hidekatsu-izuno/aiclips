      <path d="M104 108 H114 L112 124 Q109 118 104 118Z" fill="url(#field-worker-person-hair-paint)" transform="" />
      <use href="#field-worker-person-ear-left" fill="url(#field-worker-person-skin-paint)" transform="" />
      <use href="#field-worker-person-ear-left" fill="none" stroke="url(#field-worker-person-ear-bevel)" stroke-width="2" clip-path="url(#field-worker-person-ear-clip)" transform="" />
      <path d="M104 108 H114 L112 124 Q109 118 104 118Z" fill="url(#field-worker-person-hair-paint)" transform="translate(288 0) scale(-1 1)" />
      <use href="#field-worker-person-ear-left" fill="url(#field-worker-person-skin-paint)" transform="translate(288 0) scale(-1 1)" />
      <use href="#field-worker-person-ear-left" fill="none" stroke="url(#field-worker-person-ear-bevel)" stroke-width="2" clip-path="url(#field-worker-person-ear-clip)" transform="translate(288 0) scale(-1 1)" />
