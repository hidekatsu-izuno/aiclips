<svg xmlns="http://www.w3.org/2000/svg" width="288" height="288" viewBox="0 0 288 288" role="img" aria-labelledby="clock-title">
  <title id="clock-title">時計</title>
  <desc>Editable paths with shared boundaries, symmetric structural geometry, clipped bevels and crisp gradient shadows. No blur or raster images.</desc>
  <defs>
    <linearGradient id="clock-blue" gradientUnits="userSpaceOnUse" x1="96" y1="93" x2="192" y2="205">
      <stop offset="0" stop-color="#10c4fb" stop-opacity="1" />
      <stop offset="0.45" stop-color="#009cff" stop-opacity="1" />
      <stop offset="1" stop-color="#0085f4" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="clock-blue-edge" gradientUnits="userSpaceOnUse" x1="91" y1="92" x2="191" y2="203">
      <stop offset="0" stop-color="#83e7ff" stop-opacity="1" />
      <stop offset="0.5" stop-color="#16b9ff" stop-opacity="0.6" />
      <stop offset="1" stop-color="#006bdd" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="clock-blue-shadow" gradientUnits="userSpaceOnUse" x1="154" y1="122" x2="202" y2="204">
      <stop offset="0" stop-color="#0086ec" stop-opacity="0.15" />
      <stop offset="1" stop-color="#0060d1" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="clock-face-paint" gradientUnits="userSpaceOnUse" x1="99" y1="97" x2="193" y2="192">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="1" stop-color="#edf3f8" stop-opacity="1" />
    </linearGradient>
    <circle id="clock-rim" cx="143.5" cy="143.5" r="83" />
    <clipPath id="clock-rim-clip">
