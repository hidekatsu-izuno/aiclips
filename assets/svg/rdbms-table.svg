    <path d="M57 104 V87 A19 19 0 0 1 76 68 H211 A19 19 0 0 1 230 87 V104" fill="none" stroke="url(#rdbms-table-blue-edge)" stroke-width="14" clip-path="url(#rdbms-table-header-clip)" />
    <path d="M57 104 H230" fill="none" stroke="#668597" stroke-width="1.5" />
    <rect x="75" y="114" width="41" height="17" rx="1.5" fill="#009ff2" />
