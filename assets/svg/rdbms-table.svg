    <use href="#rdbms-table-body" fill="none" stroke="url(#rdbms-table-white-edge)" stroke-width="14" clip-path="url(#rdbms-table-body-clip)" />
    <use href="#rdbms-table-body" fill="none" stroke="#050b1d" stroke-width="7" />
