<svg xmlns="http://www.w3.org/2000/svg" width="288" height="288" viewBox="0 0 288 288" role="img" aria-labelledby="tablet-stylus-title">
  <title id="tablet-stylus-title">ペン付きタブレット</title>
  <desc>Editable paths with shared boundaries, symmetric structural geometry, clipped bevels and crisp gradient shadows. No blur or raster images.</desc>
  <defs>
    <linearGradient id="tablet-stylus-metal-paint" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#8ba5bc" stop-opacity="1" />
      <stop offset="0.45" stop-color="#4d6882" stop-opacity="1" />
      <stop offset="1" stop-color="#304a64" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="tablet-stylus-metal-edge" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#d1e2ef" stop-opacity="1" />
      <stop offset="0.4" stop-color="#7b99b3" stop-opacity="1" />
      <stop offset="1" stop-color="#213c56" stop-opacity="1" />
    </linearGradient>
    <rect id="tablet-stylus-body" x="54" y="74" width="172" height="140" rx="20" />
    <clipPath id="tablet-stylus-body-clip">
      <use href="#tablet-stylus-body" />
    </clipPath>
    <rect id="tablet-stylus-screen" x="65" y="86" width="150" height="116" rx="10" />
    <clipPath id="tablet-stylus-screen-clip">
      <use href="#tablet-stylus-screen" />
    </clipPath>
    <path id="tablet-stylus-pen" d="M146 183 L153.125 162.98 L215 100 Q224 91 230 98 Q236 104 227 113 L165.875 175.48 Z" />
    <clipPath id="tablet-stylus-pen-clip">
      <use href="#tablet-stylus-pen" />
    </clipPath>
    <linearGradient id="tablet-stylus-shared-glass-paint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08c4ef" stop-opacity="1" />
      <stop offset="1" stop-color="#00ade6" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="tablet-stylus-shared-glass-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#77e6fc" stop-opacity=".22" />
      <stop offset="1" stop-color="#34d2f4" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="tablet-stylus-shared-glass-shadow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#008df9" stop-opacity=".3" />
      <stop offset="1" stop-color="#007be9" stop-opacity=".8" />
    </linearGradient>
  </defs>
  <g stroke-linecap="round" stroke-linejoin="round">
    <use href="#tablet-stylus-body" fill="url(#tablet-stylus-metal-paint)" />
    <use href="#tablet-stylus-body" fill="none" stroke="url(#tablet-stylus-metal-edge)" stroke-width="15" clip-path="url(#tablet-stylus-body-clip)" />
    <use href="#tablet-stylus-body" fill="none" stroke="#050b1d" stroke-width="7" />
    <use href="#tablet-stylus-screen" fill="url(#tablet-stylus-shared-glass-paint)" />
    <path d="M65 86 H155 L65 182Z" fill="url(#tablet-stylus-shared-glass-light)" clip-path="url(#tablet-stylus-screen-clip)" />
    <path d="M192 86 H215 V202 H105Z" fill="url(#tablet-stylus-shared-glass-shadow)" clip-path="url(#tablet-stylus-screen-clip)" />
    <use href="#tablet-stylus-screen" fill="none" stroke="#050b1d" stroke-width="3" />
    <use href="#tablet-stylus-pen" fill="url(#tablet-stylus-metal-paint)" />
    <use href="#tablet-stylus-pen" fill="none" stroke="url(#tablet-stylus-metal-edge)" stroke-width="9" clip-path="url(#tablet-stylus-pen-clip)" />
    <use href="#tablet-stylus-pen" fill="none" stroke="#050b1d" stroke-width="6" />
    <path d="M146 183 L153.125 162.98 L165.875 175.48 Z" fill="#a8b9c7" stroke="#050b1d" stroke-width="2.5" />
    <path d="M159 163 L219 103" fill="none" stroke="#adbfce" stroke-width="2" />
    <path d="M215 100 L227 113" fill="none" stroke="#050b1d" stroke-width="2" />
  </g>
</svg>
