    </clipPath>
  </defs>
  <g stroke-linecap="round" stroke-linejoin="round">
    <use href="#prohibition-rim" fill="url(#prohibition-white)" />
    <use href="#prohibition-symbol" fill="url(#prohibition-red-paint)" />
    <use href="#prohibition-symbol" fill="none" stroke="url(#prohibition-red-edge)" stroke-width="9" clip-path="url(#prohibition-symbol-clip)" />
    <use href="#prohibition-rim" fill="none" stroke="#050b1d" stroke-width="7" />
