      <stop offset=".3" stop-color="#e4f1fa" stop-opacity=".24" />
      <stop offset=".55" stop-color="#e4f1fa" stop-opacity="0" />
      <stop offset=".8" stop-color="#dce9f3" stop-opacity=".18" />
      <stop offset="1" stop-color="#dce9f3" stop-opacity="0" />
    </linearGradient>
