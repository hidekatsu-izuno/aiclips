<svg xmlns="http://www.w3.org/2000/svg" width="288" height="288" viewBox="0 0 288 288" role="img" aria-labelledby="maintenance-wrench-title">
  <title id="maintenance-wrench-title">レンチ</title>
  <desc>Editable wrench with a blue grip and a simplified adjustment wheel indicated by three grooves.</desc>
  <defs>
