<svg xmlns="http://www.w3.org/2000/svg" width="288" height="288" viewBox="0 0 288 288" role="img" aria-labelledby="hard-disk-title">
  <title id="hard-disk-title">ディスクHDD</title>
  <desc>Editable paths with shared boundaries, symmetric structural geometry, clipped bevels and crisp gradient shadows. No blur or raster images.</desc>
  <defs>
    <linearGradient id="hard-disk-steel" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#7896b4" stop-opacity="1" />
      <stop offset="0.5" stop-color="#4c6682" stop-opacity="1" />
      <stop offset="1" stop-color="#354d69" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="hard-disk-steel-edge" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#c4d5e5" stop-opacity="1" />
      <stop offset="0.4" stop-color="#7798b8" stop-opacity="1" />
      <stop offset="1" stop-color="#243a53" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="hard-disk-white" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="1" stop-color="#edf2f7" stop-opacity="1" />
