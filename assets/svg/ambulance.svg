<svg xmlns="http://www.w3.org/2000/svg" width="288" height="288" viewBox="0 0 288 288" role="img" aria-labelledby="ambulance-title">
  <title id="ambulance-title">救急車</title>
  <desc>Front-facing ambulance with a wide blue windshield, a red roof beacon divided by a white center and a horizontal red stripe, twin round red warning lights, yellow rectangular headlights and a thick white bumper.</desc>
  <defs>
    <linearGradient id="ambulance-body-paint" x1="0" y1="0" x2=".25" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset=".6" stop-color="#f6f8fb" />
      <stop offset="1" stop-color="#d4dee7" />
    </linearGradient>
    <linearGradient id="ambulance-glass-paint" gradientUnits="userSpaceOnUse" x1="88" y1="98" x2="200" y2="148">
      <stop offset="0" stop-color="#08c4ef" />
      <stop offset="1" stop-color="#00ade6" />
    </linearGradient>
    <linearGradient id="ambulance-glass-highlight" gradientUnits="userSpaceOnUse" x1="95" y1="98" x2="160" y2="140">
      <stop offset="0" stop-color="#77e6fc" stop-opacity=".22" />
      <stop offset="1" stop-color="#34d2f4" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="ambulance-glass-shadow" gradientUnits="userSpaceOnUse" x1="155" y1="110" x2="203" y2="148">
      <stop offset="0" stop-color="#008df9" stop-opacity=".3" />
      <stop offset="1" stop-color="#007be9" stop-opacity=".8" />
    </linearGradient>
    <linearGradient id="ambulance-headlight-gold" x1="0" y1="0" x2=".3" y2="1">
      <stop offset="0" stop-color="#fff071" />
      <stop offset=".5" stop-color="#ffd51c" />
      <stop offset="1" stop-color="#f2a900" />
    </linearGradient>
    <linearGradient id="ambulance-red-paint" x1="0" y1="0" x2=".25" y2="1">
      <stop offset="0" stop-color="#ff8069" />
      <stop offset=".45" stop-color="#ff493b" />
      <stop offset="1" stop-color="#db2528" />
    </linearGradient>
    <linearGradient id="ambulance-steel-paint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c3d0d9" />
      <stop offset=".5" stop-color="#96aab9" />
      <stop offset="1" stop-color="#6b8193" />
    </linearGradient>
    <linearGradient id="ambulance-bumper-paint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset=".5" stop-color="#f1f5f8" />
      <stop offset="1" stop-color="#bacbd8" />
    </linearGradient>
    <linearGradient id="ambulance-tire-paint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111720" />
      <stop offset=".55" stop-color="#39434f" />
      <stop offset="1" stop-color="#192330" />
    </linearGradient>
    <path id="ambulance-body" d="M104 80 H184 Q196 80 203 96 Q212 117 218 149 V207 Q218 220 205 220 H83 Q70 220 70 207 V149 Q76 117 85 96 Q92 80 104 80 Z" />
    <clipPath id="ambulance-body-clip">
      <use href="#ambulance-body" />
    </clipPath>
    <path id="ambulance-windshield" d="M106 98 H182 Q190 98 194 109 L203 142 Q204 148 198 148 H90 Q84 148 85 142 L94 109 Q98 98 106 98 Z" />
    <clipPath id="ambulance-windshield-clip">
      <use href="#ambulance-windshield" />
    </clipPath>
    <path id="ambulance-roof-beacon" d="M98 78 L104 65 Q106 60 113 60 H175 Q182 60 184 65 L190 78 Z" />
    <clipPath id="ambulance-roof-beacon-clip">
      <use href="#ambulance-roof-beacon" />
    </clipPath>
  </defs>
  <g stroke-linecap="round" stroke-linejoin="round">
    <rect x="77" y="205" width="26" height="35" rx="7" fill="url(#ambulance-tire-paint)" stroke="#050b1d" stroke-width="6" />
    <rect x="185" y="205" width="26" height="35" rx="7" fill="url(#ambulance-tire-paint)" stroke="#050b1d" stroke-width="6" />
    <path d="M82 232 H97 M190 232 H205" fill="none" stroke="#657180" stroke-width="2" />
    <path d="M74 136 H62 M214 136 H226" fill="none" stroke="#050b1d" stroke-width="6" />
    <rect x="53" y="128" width="16" height="22" rx="4" fill="url(#ambulance-steel-paint)" stroke="#050b1d" stroke-width="5" />
    <rect x="219" y="128" width="16" height="22" rx="4" fill="url(#ambulance-steel-paint)" stroke="#050b1d" stroke-width="5" />
    <use href="#ambulance-body" fill="url(#ambulance-body-paint)" />
    <g clip-path="url(#ambulance-body-clip)">
      <path d="M76 203 V149 Q82 118 90 99 Q96 86 105 86 H183" fill="none" stroke="#ffffff" stroke-width="5" />
      <path d="M192 87 Q204 102 213 149 V207 Q213 215 204 215" fill="none" stroke="#a9bdcc" stroke-width="5" />
      <path d="M68 157 H220 V170 H68 Z" fill="url(#ambulance-red-paint)" />
      <path d="M73 158 H215" fill="none" stroke="#ff9b88" stroke-width="2" />
    </g>
    <use href="#ambulance-windshield" fill="url(#ambulance-glass-paint)" />
    <g clip-path="url(#ambulance-windshield-clip)">
      <path d="M85 98 H163 L85 148 Z" fill="url(#ambulance-glass-highlight)" />
      <path d="M183 98 H204 V148 H109 Z" fill="url(#ambulance-glass-shadow)" />
    </g>
    <use href="#ambulance-windshield" fill="none" stroke="#050b1d" stroke-width="2.3" />
    <use href="#ambulance-roof-beacon" fill="url(#ambulance-red-paint)" />
    <path d="M105 72 L108 67 Q110 65 115 65 H174" fill="none" stroke="#ffb09b" stroke-width="3" clip-path="url(#ambulance-roof-beacon-clip)" />
    <g clip-path="url(#ambulance-roof-beacon-clip)">
      <rect x="132" y="60" width="24" height="18" fill="url(#ambulance-bumper-paint)" />
      <path d="M132 60 V78 M156 60 V78" fill="none" stroke="#050b1d" stroke-width="3" />
    </g>
    <use href="#ambulance-roof-beacon" fill="none" stroke="#050b1d" stroke-width="5" />
    <circle cx="144" cy="164" r="9" fill="url(#ambulance-bumper-paint)" stroke="#050b1d" stroke-width="3" />
    <rect x="105" y="179" width="78" height="22" rx="3" fill="url(#ambulance-steel-paint)" stroke="#050b1d" stroke-width="3" />
    <path d="M110 188 H178 M110 195 H178" fill="none" stroke="#e1e9ef" stroke-width="2" />
    <circle cx="123" cy="185" r="7" fill="url(#ambulance-red-paint)" stroke="#050b1d" stroke-width="3" />
    <circle cx="165" cy="185" r="7" fill="url(#ambulance-red-paint)" stroke="#050b1d" stroke-width="3" />
    <rect x="77" y="183" width="22" height="14" rx="2" fill="url(#ambulance-headlight-gold)" stroke="#050b1d" stroke-width="1.6" />
    <path d="M80 192 V186 H95" fill="none" stroke="#fff386" stroke-width="2" />
    <rect x="189" y="183" width="22" height="14" rx="2" fill="url(#ambulance-headlight-gold)" stroke="#050b1d" stroke-width="1.6" />
    <path d="M192 192 V186 H207" fill="none" stroke="#fff386" stroke-width="2" />
    <rect x="71" y="202" width="146" height="18" rx="6" fill="url(#ambulance-bumper-paint)" stroke="#050b1d" stroke-width="3.5" />
    <path d="M78 206 H210" fill="none" stroke="#ffffff" stroke-width="2" />
    <use href="#ambulance-body" fill="none" stroke="#050b1d" stroke-width="6" />
    <rect x="131" y="210" width="26" height="14" rx="1.5" fill="#ffffff" stroke="#050b1d" stroke-width="3" />
  </g>
</svg>
