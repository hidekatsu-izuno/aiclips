  <g stroke-linecap="round" stroke-linejoin="round">
    <use href="#battery-module-body" fill="url(#battery-module-gold)" />
    <use href="#battery-module-body" fill="none" stroke="url(#battery-module-gold-edge)" stroke-width="15" clip-path="url(#battery-module-body-clip)" />
    <use href="#battery-module-lid" fill="url(#battery-module-lid-paint)" />
    <use href="#battery-module-lid" fill="none" stroke="url(#battery-module-lid-edge)" stroke-width="11" clip-path="url(#battery-module-lid-clip)" />
    <path d="M62 123 H221" fill="none" stroke="#050b1d" stroke-width="2" clip-path="url(#battery-module-body-clip)" />
    <use href="#battery-module-body" fill="none" stroke="#050b1d" stroke-width="7" />
    <use href="#battery-module-positive" fill="url(#battery-module-gold)" />
    <use href="#battery-module-positive" fill="none" stroke="url(#battery-module-gold-edge)" stroke-width="12" clip-path="url(#battery-module-positive-clip)" />
    <use href="#battery-module-positive" fill="none" stroke="#050b1d" stroke-width="5" />
    <use href="#battery-module-negative" fill="url(#battery-module-terminal-white)" />
    <use href="#battery-module-negative" fill="none" stroke="url(#battery-module-terminal-edge)" stroke-width="12" clip-path="url(#battery-module-negative-clip)" />
    <use href="#battery-module-negative" fill="none" stroke="#050b1d" stroke-width="5" />
    <use href="#battery-module-indicator-0" fill="url(#battery-module-indicator)" />
    <use href="#battery-module-indicator-0" fill="none" stroke="url(#battery-module-indicator-edge)" stroke-width="5" clip-path="url(#battery-module-indicator-0-clip)" />
    <use href="#battery-module-indicator-0" fill="none" stroke="#050b1d" stroke-width="2" />
    <use href="#battery-module-indicator-1" fill="url(#battery-module-indicator)" />
    <use href="#battery-module-indicator-1" fill="none" stroke="url(#battery-module-indicator-edge)" stroke-width="5" clip-path="url(#battery-module-indicator-1-clip)" />
    <use href="#battery-module-indicator-1" fill="none" stroke="#050b1d" stroke-width="2" />
    <use href="#battery-module-indicator-2" fill="url(#battery-module-indicator)" />
    <use href="#battery-module-indicator-2" fill="none" stroke="url(#battery-module-indicator-edge)" stroke-width="5" clip-path="url(#battery-module-indicator-2-clip)" />
    <use href="#battery-module-indicator-2" fill="none" stroke="#050b1d" stroke-width="2" />
    <use href="#battery-module-bolt" fill="url(#battery-module-bolt-paint)" />
    <use href="#battery-module-bolt" fill="none" stroke="#122037" stroke-width="4" />
  </g>
</svg>
