<svg xmlns="http://www.w3.org/2000/svg" width="288" height="288" viewBox="0 0 288 288" role="img" aria-labelledby="game-controller-title">
  <title id="game-controller-title">ゲームコントローラ</title>
  <desc>大きな十字キーとボタンを備えた白いゲームコントローラ。左右の枠は操作部の円と同心の円弧で余白を揃え、LRボタンはその外側に沿う湾曲した角丸形状で配置し、下側のグリップは短くコンパクトに。既存素材に合わせた左上のハイライト、右下の影、面と縁のグラデーション。</desc>
