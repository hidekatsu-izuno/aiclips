<svg xmlns="http://www.w3.org/2000/svg" width="288" height="288" viewBox="0 0 288 288" role="img" aria-labelledby="photo-camera-title">
  <title id="photo-camera-title">カメラ</title>
  <desc>Editable paths with shared boundaries, symmetric structural geometry, clipped bevels and crisp gradient shadows. No blur or raster images.</desc>
  <defs>
    <linearGradient id="photo-camera-steel" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#7896b4" stop-opacity="1" />
      <stop offset="0.5" stop-color="#4c6682" stop-opacity="1" />
      <stop offset="1" stop-color="#354d69" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="photo-camera-steel-edge" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#c4d5e5" stop-opacity="1" />
      <stop offset="0.4" stop-color="#7798b8" stop-opacity="1" />
      <stop offset="1" stop-color="#243a53" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="photo-camera-blue" gradientUnits="userSpaceOnUse" x1="96" y1="93" x2="192" y2="205">
      <stop offset="0" stop-color="#10c4fb" stop-opacity="1" />
      <stop offset="0.45" stop-color="#009cff" stop-opacity="1" />
      <stop offset="1" stop-color="#0085f4" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="photo-camera-blue-edge" gradientUnits="userSpaceOnUse" x1="91" y1="92" x2="191" y2="203">
      <stop offset="0" stop-color="#83e7ff" stop-opacity="1" />
      <stop offset="0.5" stop-color="#16b9ff" stop-opacity="0.6" />
      <stop offset="1" stop-color="#006bdd" stop-opacity="0.7" />
    </linearGradient>
    <rect id="photo-camera-shutter" x="77" y="86" width="32" height="23" rx="9" />
    <clipPath id="photo-camera-shutter-clip">
      <use href="#photo-camera-shutter" />
    </clipPath>
    <path id="photo-camera-body" d="M75 99 H109 L123 76 Q126 70 133 70 H172 Q179 70 182 76 L195 99 H219 Q241 99 241 121 V194 Q241 211 222 211 H73 Q52 211 52 191 V121 Q52 99 75 99 Z" />
    <clipPath id="photo-camera-body-clip">
      <use href="#photo-camera-body" />
    </clipPath>
    <circle id="photo-camera-lens-ring" cx="151" cy="160" r="51" />
    <clipPath id="photo-camera-lens-ring-clip">
      <use href="#photo-camera-lens-ring" />
    </clipPath>
    <circle id="photo-camera-lens" cx="151" cy="160" r="35" />
    <clipPath id="photo-camera-lens-clip">
      <use href="#photo-camera-lens" />
    </clipPath>
    <linearGradient id="photo-camera-flash-paint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset=".5" stop-color="#fffde4" />
      <stop offset="1" stop-color="#d5e0ea" />
    </linearGradient>
  </defs>
  <!-- Exterior width: 7 units after fills, overlapping strokes and placement transforms. -->
  <g id="photo-camera-exterior-width" fill="none" stroke="#050b1d" stroke-linecap="round" stroke-linejoin="round">
    <g stroke-linecap="round" stroke-linejoin="round"><use href="#photo-camera-shutter" fill="none" stroke="#050b1d" stroke-width="8.000000"/></g>
  </g>
  <g stroke-linecap="round" stroke-linejoin="round">
    <use href="#photo-camera-shutter" fill="url(#photo-camera-steel)" />
    <use href="#photo-camera-shutter" fill="none" stroke="url(#photo-camera-steel-edge)" stroke-width="10" clip-path="url(#photo-camera-shutter-clip)" />
    <use href="#photo-camera-shutter" fill="none" stroke="#050b1d" stroke-width="6" />
    <use href="#photo-camera-body" fill="url(#photo-camera-steel)" />
    <use href="#photo-camera-body" fill="none" stroke="url(#photo-camera-steel-edge)" stroke-width="16" clip-path="url(#photo-camera-body-clip)" />
    <use href="#photo-camera-body" fill="none" stroke="#050b1d" stroke-width="7" />
    <g id="photo-camera-flash">
      <rect x="129" y="80" width="46" height="20" rx="4" fill="#243a53" stroke="#050b1d" stroke-width="2.5" />
      <rect x="133" y="84" width="38" height="12" rx="2" fill="url(#photo-camera-flash-paint)" />
      <path d="M137 87 H167" fill="none" stroke="#ffffff" stroke-width="1.5" />
    </g>
    <rect x="201" y="114" width="19" height="14" rx="7" fill="#ff5359" stroke="#050b1d" stroke-width="2" />
    <path d="M206 116 H214" fill="none" stroke="#ffb1b2" stroke-width="1.5" />
    <use href="#photo-camera-lens-ring" fill="url(#photo-camera-steel)" />
    <use href="#photo-camera-lens-ring" fill="none" stroke="url(#photo-camera-steel-edge)" stroke-width="13" clip-path="url(#photo-camera-lens-ring-clip)" />
    <use href="#photo-camera-lens-ring" fill="none" stroke="#050b1d" stroke-width="3" />
    <use href="#photo-camera-lens" fill="url(#photo-camera-blue)" />
    <use href="#photo-camera-lens" fill="none" stroke="url(#photo-camera-blue-edge)" stroke-width="11" clip-path="url(#photo-camera-lens-clip)" />
    <use href="#photo-camera-lens" fill="none" stroke="#050b1d" stroke-width="3" />
    <path d="M171 133 A35 35 0 0 1 126 184 Q158 180 171 133 Z" fill="#0088e7" fill-opacity=".5" clip-path="url(#photo-camera-lens-clip)" />
    <path d="M131 150 Q134 143 140 141" fill="none" stroke="#b7f8ff" stroke-width="5" />
  </g>
</svg>
