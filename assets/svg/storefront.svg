<svg xmlns="http://www.w3.org/2000/svg" width="288" height="288" viewBox="0 0 288 288" role="img" aria-labelledby="storefront-title">
  <title id="storefront-title">店舗</title>
  <desc>Editable vector illustration reconstructed from the reference silhouette, with shared boundaries and clipped gradient highlights.</desc>
  <defs>
    <linearGradient id="storefront-blue" x1="0" y1="0" x2=".3" y2="1">
      <stop offset="0.0" stop-color="#0bc5ff" />
