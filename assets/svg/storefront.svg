    <path d="M120.333333 100 H144 V148 Q129.5 164 115 148 Z" fill="url(#storefront-awning-red)" stroke="none" stroke-width="0" clip-path="url(#storefront-shape6-clip)" />
    <path d="M167.666667 100 H191.333333 L202 148 Q187.5 164 173 148 Z" fill="url(#storefront-awning-red)" stroke="none" stroke-width="0" clip-path="url(#storefront-shape6-clip)" />
    <path d="M76 104 L63 131" fill="none" stroke="url(#storefront-awning-edge)" stroke-width="3" clip-path="url(#storefront-shape6-clip)" />
