<svg xmlns="http://www.w3.org/2000/svg" width="288" height="288" viewBox="0 0 288 288" role="img" aria-labelledby="algorithm-merge-title">
  <title id="algorithm-merge-title">マージ</title>
  <desc>Editable merge illustration with vertically mirrored incoming branches, flat dark-gray shafts and a gold output arrow centered on the same horizontal axis.</desc>
