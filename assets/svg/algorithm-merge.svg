    <use href="#algorithm-merge-shape2" fill="url(#algorithm-merge-gold)" />
    <use href="#algorithm-merge-shape2" fill="none" stroke="#fff47d" stroke-width="13" stroke-linejoin="miter" clip-path="url(#algorithm-merge-shape2-clip)" />
    <use href="#algorithm-merge-shape2" fill="none" stroke="#050b1d" stroke-width="7" stroke-linejoin="miter" />
