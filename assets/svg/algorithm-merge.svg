      <stop offset="1.0" stop-color="#f2a900" />
    </linearGradient>
    <path id="algorithm-merge-shape1" d="M79 84 H96 Q119 84 132.7 107.8 L149 133 H174 V151 H149 L132.7 176.2 Q119 200 96 200 H79 A9 9 0 0 1 79 182 H96 Q108 182 117.3 166.8 L136 142 L117.3 117.2 Q108 102 96 102 H79 A9 9 0 0 1 79 84 Z" />
    <path id="algorithm-merge-shape2" d="M182 115 L213 139 Q217 142 213 145 L182 169 V151 H142 A9 9 0 0 1 142 133 H182 Z" />
    <clipPath id="algorithm-merge-shape2-clip">
