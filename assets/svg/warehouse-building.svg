<svg xmlns="http://www.w3.org/2000/svg" width="288" height="288" viewBox="0 0 288 288" role="img" aria-labelledby="warehouse-building-title">
  <title id="warehouse-building-title">倉庫</title>
  <desc>Editable illustration with flat front-facing cartons, warm colors, tape and directional highlights matching shipping-carton.</desc>
