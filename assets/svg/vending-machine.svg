<svg xmlns="http://www.w3.org/2000/svg" width="288" height="288" viewBox="0 0 288 288" role="img" aria-labelledby="vending-machine-title">
  <title id="vending-machine-title">自動販売機</title>
  <desc>Editable geometric illustration with clipped gradient highlights, transparent background and a 7px exterior outline at 288px.</desc>
  <defs>
