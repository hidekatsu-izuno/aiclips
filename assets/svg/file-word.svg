<svg xmlns="http://www.w3.org/2000/svg" width="288" height="288" viewBox="0 0 288 288" role="img" aria-labelledby="file-word-title">
  <title id="file-word-title">WORD</title>
  <desc>Word document with a blue heading, body text and an embedded bar chart with body text wrapping along its right side.</desc>
  <defs>
    <linearGradient id="file-word-blue" x1="0" y1="0" x2=".3" y2="1">
      <stop offset="0.0" stop-color="#0bc5ff" />
      <stop offset="0.5" stop-color="#0099ff" />
      <stop offset="1.0" stop-color="#0078ed" />
    </linearGradient>
    <linearGradient id="file-word-silver-edge" x1="0" y1="0" x2=".3" y2="1">
      <stop offset="0.0" stop-color="#ffffff" />
      <stop offset="0.5" stop-color="#dce5ef" />
      <stop offset="1.0" stop-color="#9caec2" />
    </linearGradient>
    <linearGradient id="file-word-sheet" x1="0" y1="0" x2=".3" y2="1">
      <stop offset="0.0" stop-color="#ffffff" />
      <stop offset="0.5" stop-color="#fcfcfe" />
      <stop offset="1.0" stop-color="#edf0f5" />
    </linearGradient>
    <path id="file-word-shape1" d="M92 64 H169 L212 106 V208 Q212 224 196 224 H92 Q76 224 76 208 V80 Q76 64 92 64 Z" />
    <clipPath id="file-word-shape1-clip">
      <use href="#file-word-shape1" />
    </clipPath>
    <linearGradient id="file-word-line-paint1" x1="96" y1="90" x2="190" y2="218" gradientUnits="userSpaceOnUse">
      <stop offset="0.0" stop-color="#0bc5ff" />
      <stop offset="0.5" stop-color="#0099ff" />
      <stop offset="1.0" stop-color="#0078ed" />
    </linearGradient>
    <linearGradient id="file-word-line-paint2" x1="96" y1="90" x2="190" y2="218" gradientUnits="userSpaceOnUse">
      <stop offset="0.0" stop-color="#8199ae" />
      <stop offset="0.5" stop-color="#607b95" />
      <stop offset="1.0" stop-color="#425e79" />
    </linearGradient>
    <linearGradient id="file-word-line-paint5" x1="96" y1="90" x2="190" y2="218" gradientUnits="userSpaceOnUse">
      <stop offset="0.0" stop-color="#8199ae" />
      <stop offset="0.5" stop-color="#607b95" />
      <stop offset="1.0" stop-color="#425e79" />
    </linearGradient>
  </defs>
  <g stroke-linecap="round" stroke-linejoin="round">
    <use href="#file-word-shape1" fill="url(#file-word-sheet)" />
    <use href="#file-word-shape1" fill="none" stroke="url(#file-word-silver-edge)" stroke-width="5" clip-path="url(#file-word-shape1-clip)" />
    <use href="#file-word-shape1" fill="none" stroke="#050b1d" stroke-width="7" />
    <path d="M169 68 L208 107 H179 Q169 107 169 97 Z" fill="url(#file-word-blue)" stroke="none" stroke-width="0" />
    <path d="M101 101 H142" fill="none" stroke="url(#file-word-line-paint1)" stroke-width="12" />
    <path d="M101 125 H183" fill="none" stroke="url(#file-word-line-paint2)" stroke-width="9" />
    <g id="file-word-embedded-chart">
      <rect x="98" y="139" width="48" height="38" rx="2" fill="#e5f3ff" stroke="#607b95" stroke-width="1.5" />
      <g fill="url(#file-word-blue)">
        <rect x="105" y="159" width="8" height="11" rx="1" />
        <rect x="118" y="153" width="8" height="17" rx="1" />
        <rect x="131" y="147" width="8" height="23" rx="1" />
      </g>
      <path d="M103 171 H141" fill="none" stroke="#607b95" stroke-width="1.5" />
    </g>
    <path d="M158 143 H183 M158 159 H183 M158 175 H175" fill="none" stroke="url(#file-word-line-paint2)" stroke-width="9" />
    <path d="M101 193 H169" fill="none" stroke="url(#file-word-line-paint5)" stroke-width="9" />
  </g>
</svg>
