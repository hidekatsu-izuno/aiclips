    <path d="M81 201 H89" fill="none" stroke="#b7c9d8" stroke-width="6" />
    <path d="M107 167 H169" fill="none" stroke="#b7c9d8" stroke-width="6" />
    <path d="M107 184 H145" fill="none" stroke="#b7c9d8" stroke-width="6" />
