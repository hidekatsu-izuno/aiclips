    </linearGradient>
    <linearGradient id="console-terminal-dot-2-paint" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#a9ffd0" stop-opacity="1" />
      <stop offset="0.45" stop-color="#29d96d" stop-opacity="1" />
