<svg xmlns="http://www.w3.org/2000/svg" width="288" height="288" viewBox="0 0 288 288" role="img" aria-labelledby="credit-card-title">
  <title id="credit-card-title">クレジットカード</title>
  <desc>Editable paths with shared boundaries, symmetric structural geometry, clipped bevels and crisp gradient shadows. No blur or raster images.</desc>
  <defs>
    <linearGradient id="credit-card-blue" gradientUnits="userSpaceOnUse" x1="96" y1="93" x2="192" y2="205">
      <stop offset="0" stop-color="#10c4fb" stop-opacity="1" />
      <stop offset="0.45" stop-color="#009cff" stop-opacity="1" />
      <stop offset="1" stop-color="#0085f4" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="credit-card-blue-edge" gradientUnits="userSpaceOnUse" x1="91" y1="92" x2="191" y2="203">
      <stop offset="0" stop-color="#83e7ff" stop-opacity="1" />
      <stop offset="0.5" stop-color="#16b9ff" stop-opacity="0.6" />
      <stop offset="1" stop-color="#006bdd" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="credit-card-gold" gradientUnits="userSpaceOnUse" x1="105" y1="80" x2="188" y2="213">
      <stop offset="0" stop-color="#ffe23a" stop-opacity="1" />
      <stop offset="0.5" stop-color="#ffd000" stop-opacity="1" />
      <stop offset="1" stop-color="#ffc300" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="credit-card-gold-edge" gradientUnits="userSpaceOnUse" x1="100" y1="100" x2="187" y2="206">
      <stop offset="0" stop-color="#fff487" stop-opacity="1" />
      <stop offset="0.5" stop-color="#ffdf35" stop-opacity="1" />
      <stop offset="1" stop-color="#ecac00" stop-opacity="1" />
    </linearGradient>
    <rect id="credit-card-card" x="59" y="83" width="175" height="122" rx="19" />
    <clipPath id="credit-card-card-clip">
      <use href="#credit-card-card" />
    </clipPath>
    <rect id="credit-card-chip" x="80" y="121" width="40" height="35" rx="7" />
    <clipPath id="credit-card-chip-clip">
      <use href="#credit-card-chip" />
    </clipPath>
  </defs>
  <g stroke-linecap="round" stroke-linejoin="round">
    <use href="#credit-card-card" fill="url(#credit-card-blue)" />
    <use href="#credit-card-card" fill="none" stroke="url(#credit-card-blue-edge)" stroke-width="13" clip-path="url(#credit-card-card-clip)" />
    <use href="#credit-card-card" fill="none" stroke="#050b1d" stroke-width="7" />
    <use href="#credit-card-chip" fill="url(#credit-card-gold)" />
    <use href="#credit-card-chip" fill="none" stroke="url(#credit-card-gold-edge)" stroke-width="7" clip-path="url(#credit-card-chip-clip)" />
    <use href="#credit-card-chip" fill="none" stroke="#050b1d" stroke-width="3" />
    <path d="M93 123 V154 M106 123 V154 M82 132 H93 M82 144 H93 M106 132 H118 M106 144 H118" fill="none" stroke="#bd7c00" stroke-width="2" clip-path="url(#credit-card-chip-clip)" />
    <path d="M95 124 V153 M108 124 V130 M108 135 V142 M108 147 V153" fill="none" stroke="#fff18b" stroke-width="1.2" clip-path="url(#credit-card-chip-clip)" />
    <rect x="125" y="160" width="42" height="8" rx="4" fill="#effaff" />
    <path d="M129 161.5 H163" fill="none" stroke="#ffffff" stroke-width="1" />
    <rect x="180" y="160" width="35" height="8" rx="4" fill="#effaff" />
    <path d="M184 161.5 H211" fill="none" stroke="#ffffff" stroke-width="1" />
    <rect x="81" y="178" width="53" height="8" rx="4" fill="#effaff" />
    <path d="M85 179.5 H130" fill="none" stroke="#ffffff" stroke-width="1" />
  </g>
</svg>
