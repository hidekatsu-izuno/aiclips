<svg xmlns="http://www.w3.org/2000/svg" width="288" height="288" viewBox="0 0 288 288" role="img" aria-labelledby="broadleaf-tree-title">
  <title id="broadleaf-tree-title">広葉樹</title>
  <desc>Editable broadleaf tree with a three-branched trunk, rounded foliage, a broad upper-left highlight and shaded lower foliage.</desc>
  <defs>
