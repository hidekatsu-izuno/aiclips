      <stop offset="1.0" stop-color="#f2a900" />
    </linearGradient>
    <linearGradient id="money-bag-beige" gradientUnits="userSpaceOnUse" x1="95" y1="120" x2="199" y2="214">
      <stop stop-color="#ffeac8" />
      <stop offset=".6" stop-color="#f7d9b0" />
      <stop offset="1" stop-color="#efd0a7" />
    </linearGradient>
    <path id="money-bag-shape1" d="M104 113 C83 132 62 167 64 193 C66 218 100 224 145 224 C185 224 217 218 222 200 C228 176 203 128 181 113 Z" />
