      <path d="M109 112 Q111 118 107 125 M123 116 Q125 121 120 129 M138 117 Q139 123 134 131 M153 116 Q155 123 149 129 M167 114 Q170 119 164 126 M180 109 Q183 115 177 122" fill="none" stroke="#996017" stroke-width="1.8" />
