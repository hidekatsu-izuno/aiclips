<svg xmlns="http://www.w3.org/2000/svg" width="288" height="288" viewBox="0 0 288 288" role="img" aria-labelledby="money-bag-title">
  <title id="money-bag-title">お金</title>
  <desc>Editable money bag with a rounded fabric body, folded opening, overlapping coins and directional cloth shading.</desc>
  <defs>
