    <path d="M118 147 H129 L140 168 L151 147 H161 L146 172 H158 V179 H145 V185 H158 V192 H145 V203 H134 V192 H120 V185 H134 V179 H120 V172 H134Z" fill="#663509" stroke="#663509" stroke-width="1.5" />
