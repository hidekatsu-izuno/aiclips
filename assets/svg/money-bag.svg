    <path d="M100 87 Q101 93 112 91 C125 87 136 102 150 98 C163 95 164 90 178 89 Q183 88 184 83 L188 89 Q181 113 145 116 Q115 117 101 104Z" fill="url(#money-bag-fold)" />
    <path d="M102 87 Q104 93 113 91 C126 88 135 102 150 98 C163 95 166 91 178 89 Q183 88 184 83" fill="none" stroke="#171207" stroke-width="4" />
    <path d="M103 97 C120 92 134 110 151 104 Q170 94 180 94" fill="none" stroke="#ffeccd" stroke-width="3" />
    <path d="M112 101 Q116 101 123 114 L116 114 Q110 108 112 101Z M166 105 L174 100 Q171 111 164 115 H159Z" fill="#c69e79" opacity=".5" />
