    <clipPath id="mountain-front-clip"><use href="#mountain-front"/></clipPath>
    <linearGradient id="mountain-back-green" gradientUnits="userSpaceOnUse" x1="147" y1="100" x2="204" y2="216"><stop stop-color="#56bd65"/><stop offset=".5" stop-color="#299953"/><stop offset="1" stop-color="#147741"/></linearGradient>
    <linearGradient id="mountain-front-green" gradientUnits="userSpaceOnUse" x1="91" y1="141" x2="148" y2="216"><stop stop-color="#86c958"/><stop offset=".48" stop-color="#55b44c"/><stop offset="1" stop-color="#329247"/></linearGradient>
