    <linearGradient id="mountain-front-shadow" gradientUnits="userSpaceOnUse" x1="127" y1="145" x2="161" y2="215"><stop stop-color="#167c39" stop-opacity="0"/><stop offset="1" stop-color="#167c39" stop-opacity=".5"/></linearGradient>
