    <use href="#business-briefcase-flap" fill="url(#business-briefcase-flap-paint)" />
    <path id="business-briefcase-upper-bevel" d="M59 144 V115 A18 18 0 0 1 77 97 H211 A18 18 0 0 1 229 115 V144" fill="none" stroke="url(#business-briefcase-flap-edge)" stroke-width="15" stroke-linecap="butt" clip-path="url(#business-briefcase-flap-clip)" />
    <path id="business-briefcase-lower-bevel" d="M59 144 A15 14 0 0 0 74 158 H214 A15 14 0 0 0 229 144" fill="none" stroke="url(#business-briefcase-flap-edge)" stroke-width="10.5" stroke-linecap="butt" clip-path="url(#business-briefcase-flap-clip)" />
    <path d="M59 144 A15 14 0 0 0 74 158 H214 A15 14 0 0 0 229 144" fill="none" stroke="#050b1d" stroke-width="3.5" />
