    <use href="#business-briefcase-latch" fill="none" stroke="url(#business-briefcase-gold-edge)" stroke-width="9" clip-path="url(#business-briefcase-latch-clip)" />
    <use href="#business-briefcase-latch" fill="none" stroke="#050b1d" stroke-width="3.5" />
    <path d="M127 165 H161" fill="none" stroke="#2d260b" stroke-width="2" clip-path="url(#business-briefcase-latch-clip)" />
