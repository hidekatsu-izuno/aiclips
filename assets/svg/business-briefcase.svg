<svg xmlns="http://www.w3.org/2000/svg" width="288" height="288" viewBox="0 0 288 288" role="img" aria-labelledby="business-briefcase-title">
  <title id="business-briefcase-title">ブリーフケース</title>
  <desc>Editable paths with shared boundaries, symmetric structural geometry, clipped bevels and crisp gradient shadows. No blur or raster images.</desc>
  <defs>
    <linearGradient id="business-briefcase-leather" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#cf7738" stop-opacity="1" />
      <stop offset="0.5" stop-color="#bd602b" stop-opacity="1" />
      <stop offset="1" stop-color="#ad4c23" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="business-briefcase-leather-edge" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffd095" stop-opacity="1" />
      <stop offset="0.35" stop-color="#df9156" stop-opacity="1" />
      <stop offset="1" stop-color="#853b20" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="business-briefcase-flap-paint" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#cc7135" stop-opacity="1" />
      <stop offset="1" stop-color="#b65a29" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="business-briefcase-gold" gradientUnits="userSpaceOnUse" x1="105" y1="80" x2="188" y2="213">
      <stop offset="0" stop-color="#ffe23a" stop-opacity="1" />
      <stop offset="0.5" stop-color="#ffd000" stop-opacity="1" />
      <stop offset="1" stop-color="#ffc300" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="business-briefcase-gold-edge" gradientUnits="userSpaceOnUse" x1="100" y1="100" x2="187" y2="206">
      <stop offset="0" stop-color="#fff487" stop-opacity="1" />
      <stop offset="0.5" stop-color="#ffdf35" stop-opacity="1" />
      <stop offset="1" stop-color="#ecac00" stop-opacity="1" />
    </linearGradient>
    <path id="business-briefcase-handle" d="M109 97 V89 Q109 68 130 68 H158 Q179 68 179 89 V97 H162 V89 Q162 85 158 85 H130 Q126 85 126 89 V97 Z" />
    <clipPath id="business-briefcase-handle-clip">
      <use href="#business-briefcase-handle" />
    </clipPath>
