    <clipPath id="business-briefcase-latch-clip">
      <use href="#business-briefcase-latch" />
    </clipPath>
    <linearGradient id="business-briefcase-handle-light" gradientUnits="userSpaceOnUse" x1="114" y1="73" x2="177" y2="97">
      <stop offset="0" stop-color="#ffcf94" />
      <stop offset=".5" stop-color="#f3aa6a" />
      <stop offset="1" stop-color="#d17b41" />
    </linearGradient>
    <linearGradient id="business-briefcase-flap-edge" gradientUnits="userSpaceOnUse" x1="59" y1="97" x2="110" y2="158">
