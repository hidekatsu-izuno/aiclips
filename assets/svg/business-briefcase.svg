    <path d="M120 97 V89 Q120 79 130 79 H158 Q168 79 168 89 V97" fill="none" stroke="#9d4724" stroke-width="4" clip-path="url(#business-briefcase-handle-clip)" />
    <use href="#business-briefcase-handle" fill="none" stroke="#050b1d" stroke-width="7" />
