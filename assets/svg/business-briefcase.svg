    <clipPath id="business-briefcase-body-clip">
      <use href="#business-briefcase-body" />
    </clipPath>
    <path id="business-briefcase-flap" d="M77 97 H211 A18 18 0 0 1 229 115 V144 A15 14 0 0 1 214 158 H74 A15 14 0 0 1 59 144 V115 A18 18 0 0 1 77 97 Z" />
